<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sin él, env(safe-area-inset-*) devuelve 0 y la
         barra inferior se mete bajo el indicador de inicio del iPhone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- El color del tema es el lienzo, no el de marca: una barra de estado
         naranja pelearía con el fondo de la app. -->
    <meta name="theme-color" content="#16110e" />
    <meta name="color-scheme" content="dark light" />

    <title>Caudal · Gastos</title>
    <meta
      name="description"
      content="Control de gastos personales. Apunta en segundos, separa por apartados y mira a dónde va tu dinero."
    />

    <!-- og:start -->
    <!-- Previsualización al compartir el enlace. La dirección absoluta la
         inyecta vite.config.ts desde SITE_URL: sin ella estas etiquetas se
         retiran enteras, porque una imagen que no carga se ve peor que no
         tener tarjeta. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Caudal" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Caudal · Control de gastos" />
    <meta
      property="og:description"
      content="Apunta un gasto en segundos y mira a dónde va tu dinero. Sin cuentas, sin servidor y sin conexión: todo se queda en tu móvil."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Caudal — tu dinero, en movimiento" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Caudal · Control de gastos" />
    <meta
      name="twitter:description"
      content="Apunta un gasto en segundos y mira a dónde va tu dinero. Todo se queda en tu móvil."
    />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <!-- og:end -->

    <!-- iOS: sigue sin haber beforeinstallprompt, y apple-touch-icon tiene que
         ser un PNG opaco de 180x180 o iOS lo compone sobre negro. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Caudal" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Las fuentes se sirven desde el propio proyecto (public/fonts): así la
         app funciona sin red desde el primer arranque y no manda la IP del
         usuario a un tercero en cada apertura, que en una app de finanzas
         personales importa. Se precarga sólo el subconjunto latino del cuerpo,
         que es el que aparece en el primer pintado. -->
    <link
      rel="preload"
      href="/fonts/plex-sans-latin-400700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Pinta el fondo antes de que arranque React: sin esto se ve un
         destello blanco al abrir la app instalada. -->
    <style>
      html,
      body {
        background: #16110e;
      }
    </style>
    <script>
      // El tema elegido se aplica ANTES del primer pintado. Hacerlo desde
      // React dejaría ver un fogonazo del tema contrario en cada arranque.
      try {
        if (localStorage.getItem('caudal-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.background = '#f7f0e7'
          document.querySelector('meta[name="theme-color"]').content = '#f7f0e7'
        }
      } catch (error) {
        /* Modo privado: se queda con el tema oscuro por defecto. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
