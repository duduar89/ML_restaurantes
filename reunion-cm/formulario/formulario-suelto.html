<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<style>
  html{color-scheme:light dark}
  body{margin:0;font-family:system-ui,sans-serif;font-size:14px}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Dónde se te va el tiempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">

<style>
:root{
  --paper:#F1F4F0;
  --surface:#FFFFFF;
  --surface-2:#E7EDE8;
  --ink:#17211C;
  --ink-2:#3F5349;
  --ink-3:#77897E;
  --line:#D2DBD4;
  --line-strong:#B7C4BB;
  --accent:#1F6B57;
  --accent-ink:#FFFFFF;
  --accent-soft:#DFEDE6;
  --gold:#9A6B14;
  --gold-soft:#F7EBD1;
  --gold-line:#E3CB95;
  --shadow:0 1px 2px rgba(23,33,28,.05), 0 8px 24px -16px rgba(23,33,28,.28);

  --f-display:"Fraunces","Iowan Old Style",Georgia,serif;
  --f-body:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1512;
    --surface:#18211C;
    --surface-2:#202B24;
    --ink:#E6EDE8;
    --ink-2:#AFC1B6;
    --ink-3:#7F9488;
    --line:#2B3931;
    --line-strong:#3B4C42;
    --accent:#63C0A2;
    --accent-ink:#0F1512;
    --accent-soft:#1B2F28;
    --gold:#E9BB5E;
    --gold-soft:#2A2314;
    --gold-line:#4A3D1E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1512;
  --surface:#18211C;
  --surface-2:#202B24;
  --ink:#E6EDE8;
  --ink-2:#AFC1B6;
  --ink-3:#7F9488;
  --line:#2B3931;
  --line-strong:#3B4C42;
  --accent:#63C0A2;
  --accent-ink:#0F1512;
  --accent-soft:#1B2F28;
  --gold:#E9BB5E;
  --gold-soft:#2A2314;
  --gold-line:#4A3D1E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:16.5px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding:0 0 96px;
}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit}

/* ---------- progreso ---------- */
.progreso{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(160%) blur(10px);
  border-bottom:1px solid var(--line);
}
.progreso-barra{height:3px;background:var(--line)}
.progreso-relleno{height:100%;width:0;background:var(--accent);transition:width .35s ease}
.progreso-texto{
  max-width:640px;margin:0 auto;padding:7px 20px;
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-family:var(--f-mono);font-size:11.5px;letter-spacing:.03em;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}
.progreso-texto b{color:var(--ink-2);font-weight:500}

.envoltura{max-width:640px;margin:0 auto;padding:0 20px}

/* ---------- portada ---------- */
.portada{padding:44px 0 34px;border-bottom:1px solid var(--line)}
.sello{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:20px;
}
.sello::before{content:"";width:22px;height:1px;background:var(--accent)}
.portada h1{font-size:clamp(31px,8vw,44px);letter-spacing:-.02em;font-weight:600}
.portada .subtitulo{
  font-family:var(--f-display);font-size:clamp(17px,4.4vw,20px);
  color:var(--ink-2);margin-top:12px;font-style:italic;font-weight:400;
}
.intro{margin-top:22px;color:var(--ink-2);max-width:56ch}
.intro p + p{margin-top:11px}
.meta{
  margin-top:24px;display:flex;flex-wrap:wrap;gap:8px;
}
.meta span{
  font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);
  padding:6px 10px;border-radius:4px;
}

/* ---------- bloques ---------- */
.bloque{padding:38px 0 8px;border-top:1px solid var(--line)}
.bloque:first-of-type{border-top:none}
.bloque-cab{display:flex;gap:14px;align-items:flex-start;margin-bottom:26px}
.bloque-num{
  font-family:var(--f-mono);font-size:12px;color:var(--ink-3);
  padding-top:5px;font-variant-numeric:tabular-nums;flex:none;
}
.bloque h2{font-size:24px;letter-spacing:-.01em}
.bloque-cab .ctx{margin-top:6px;color:var(--ink-3);font-size:14.5px;max-width:52ch}

.p{margin-bottom:30px;scroll-margin-top:80px}
.p-enunciado{font-weight:600;font-size:17px;letter-spacing:-.005em;display:block}
.p-opcional{
  font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);
  letter-spacing:.05em;text-transform:uppercase;margin-left:8px;white-space:nowrap;
}
.p-ayuda{color:var(--ink-3);font-size:14px;margin-top:5px;max-width:52ch}
.p-campos{margin-top:13px}

/* opción única: filas rectangulares */
.unica{display:flex;flex-direction:column;gap:7px}
.unica label{
  display:flex;align-items:center;gap:11px;
  background:var(--surface);border:1px solid var(--line);border-radius:7px;
  padding:12px 14px;cursor:pointer;min-height:46px;
  transition:border-color .12s, background .12s;
}
.unica label:hover{border-color:var(--line-strong)}
.unica .marca{
  width:15px;height:15px;border:1.5px solid var(--line-strong);border-radius:50%;
  flex:none;position:relative;transition:border-color .12s;
}
.unica input:checked ~ .marca{border-color:var(--accent);border-width:5px}
.unica input:checked ~ .txt{font-weight:600}
.unica label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

/* opción múltiple: pastillas */
.multiple{display:flex;flex-wrap:wrap;gap:7px}
.multiple label{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:9px 14px;cursor:pointer;min-height:42px;font-size:15px;
  transition:border-color .12s, background .12s;
}
.multiple label:hover{border-color:var(--line-strong)}
.multiple label:has(input:checked){
  border-color:var(--accent);background:var(--accent-soft);font-weight:600;
}
.multiple .marca{
  width:14px;height:14px;border:1.5px solid var(--line-strong);border-radius:3px;flex:none;
  display:grid;place-items:center;
}
.multiple label:has(input:checked) .marca{background:var(--accent);border-color:var(--accent)}
.multiple .marca::after{
  content:"";width:7px;height:4px;border-left:1.7px solid var(--accent-ink);
  border-bottom:1.7px solid var(--accent-ink);transform:rotate(-45deg) translateY(-1px);
  opacity:0;
}
.multiple label:has(input:checked) .marca::after{opacity:1}

input[type=radio],input[type=checkbox]{position:absolute;opacity:0;width:0;height:0}
label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* escala */
.escala{display:flex;flex-direction:column;gap:8px}
.escala-fila{display:flex;gap:6px}
.escala-fila label{
  flex:1;display:grid;place-items:center;min-height:50px;
  background:var(--surface);border:1px solid var(--line);border-radius:7px;
  font-family:var(--f-mono);font-size:15px;cursor:pointer;
  transition:border-color .12s, background .12s;
}
.escala-fila label:has(input:checked){
  background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500;
}
.escala-topes{
  display:flex;justify-content:space-between;
  font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.02em;
}

/* ranking */
.ranking{display:flex;flex-direction:column;gap:7px}
.ranking button{
  display:flex;align-items:center;gap:11px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:7px;
  padding:12px 14px;cursor:pointer;min-height:46px;width:100%;
  transition:border-color .12s, background .12s;
}
.ranking button:hover{border-color:var(--line-strong)}
.ranking button[data-orden]{border-color:var(--gold-line);background:var(--gold-soft)}
.ranking .orden{
  width:24px;height:24px;flex:none;border-radius:5px;
  border:1px dashed var(--line-strong);
  display:grid;place-items:center;
  font-family:var(--f-mono);font-size:12px;color:var(--ink-3);
}
.ranking button[data-orden] .orden{
  background:var(--gold);border:1px solid var(--gold);color:var(--paper);border-style:solid;font-weight:500;
}
.ranking button[data-orden] .orden::after{content:attr(data-n)}

/* texto */
textarea,input[type=text]{
  width:100%;font-family:var(--f-body);font-size:16px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:7px;
  padding:12px 13px;line-height:1.5;
}
textarea{min-height:104px;resize:vertical}
textarea:focus,input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea::placeholder,input::placeholder{color:var(--ink-3)}
.contador{
  font-family:var(--f-mono);font-size:11px;color:var(--ink-3);
  text-align:right;margin-top:4px;font-variant-numeric:tabular-nums;
}

/* ---------- tarjeta de cálculo ---------- */
.calculo{
  border:1px solid var(--gold-line);background:var(--gold-soft);
  border-radius:9px;padding:18px 18px 16px;margin:6px 0 30px;
}
.calculo .et{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);margin-bottom:9px;
}
.calculo .cifra{
  font-family:var(--f-display);font-size:38px;font-weight:600;line-height:1;
  color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.calculo .cifra small{display:block;font-size:15.5px;font-weight:400;color:var(--ink-2);margin-top:6px;font-family:var(--f-body);letter-spacing:0}
.calculo .glosa{margin-top:9px;color:var(--ink-2);font-size:14.5px;max-width:48ch}
.calculo .desglose{
  margin-top:12px;padding-top:11px;border-top:1px solid var(--gold-line);
  font-family:var(--f-mono);font-size:12px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}

/* ---------- envío ---------- */
.envio{border-top:1px solid var(--line);margin-top:24px;padding-top:34px}
.envio h2{font-size:24px}
.envio .txt{margin-top:11px;color:var(--ink-2);max-width:54ch}
.acciones{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.btn{
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  border-radius:8px;padding:15px 20px;font-weight:700;font-size:16px;cursor:pointer;
  min-height:52px;transition:opacity .12s;
}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line-strong);font-weight:600}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.aviso{
  margin-top:16px;font-size:13px;color:var(--ink-3);max-width:54ch;
  padding-top:14px;border-top:1px solid var(--line);
}
.estado{
  margin-top:14px;padding:13px 15px;border-radius:8px;font-size:14.5px;
  border:1px solid var(--line);background:var(--surface);
}
.estado.ok{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.estado.aviso-fallo{border-color:var(--gold-line);background:var(--gold-soft)}
.faltan{
  margin-top:14px;font-size:14px;color:var(--gold);font-weight:600;
}
.faltan a{color:inherit}
pre.volcado{
  margin-top:12px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:13px;font-family:var(--f-mono);font-size:12px;
  white-space:pre-wrap;word-break:break-word;max-height:280px;overflow:auto;color:var(--ink-2);
}

.pie{
  margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
  font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--ink-3);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
  html{scroll-behavior:auto}
}
@media (min-width:700px){
  html{scroll-behavior:smooth}
}
</style>
</head>
<body>


<div class="progreso">
  <div class="progreso-barra"><div class="progreso-relleno" id="barra"></div></div>
  <div class="progreso-texto">
    <span id="pcontador">—</span>
    <span id="ptiempo"></span>
  </div>
</div>

<div class="envoltura">
  <header class="portada">
    <div class="sello" id="sello">Antes de vernos</div>
    <h1 id="titulo">…</h1>
    <p class="subtitulo" id="subtitulo"></p>
    <div class="intro" id="intro"></div>
    <div class="meta" id="meta"></div>
  </header>

  <main id="formulario"></main>

  <section class="envio" id="envio">
    <h2>Ya está</h2>
    <p class="txt" id="cierre"></p>
    <div class="faltan" id="faltan" hidden></div>
    <div class="acciones">
      <button class="btn" id="enviar">Mandármelas por WhatsApp</button>
      <button class="btn sec" id="copiar">Copiar las respuestas</button>
    </div>
    <div class="estado" id="estado" hidden></div>
    <pre class="volcado" id="volcado" hidden></pre>
    <p class="aviso" id="privacidad"></p>
  </section>

  <footer class="pie">
    <span id="pie-izq"></span>
    <span id="guardado">Se guarda solo en este móvil</span>
  </footer>
</div>

<script>
/* ================= CONTENIDO ================= */
const FORM = {
  titulo: "Dónde se te va el tiempo",
  subtitulo: "Casi todo es marcar opciones. Se hace desde el móvil.",
  intro: [
    "Te mando esto para no quemarnos media reunión mañana con que tú me cuentes cómo es tu semana y yo tomando notas.",
    "Son unos 8 minutos y casi todo es marcar opciones: solo hay tres huecos para escribir y los tres son opcionales. Contesta a ojo, en serio — prefiero un número aproximado tuyo que uno exacto que te cueste media hora sacar. No mires ningún Excel ni cuentes publicaciones.",
    "Y a cambio, mañana llego con un par de cosas ya montadas sobre lo que me cuentes aquí, en vez de con una presentación de las de siempre. Nada de lo que me pongas te lo voy a hacer repetir. Esto lo leo solo yo."
  ],
  meta: ["~8 minutos", "20 preguntas", "12 son de un toque", "3 de escribir, opcionales"],
  cierre: "Ya está, gracias de verdad. Me lo leo entero esta noche, así que mañana no te voy a hacer repetir nada de esto: llego con un par de cosas montadas sobre lo que me acabas de contar y, si me has pasado el @ de alguna cuenta, con esa cuenta concreta.\n\nSi al soltar el móvil se te ocurre algo más, mándamelo por WhatsApp tal cual, aunque sea un audio de dos minutos. Me vale igual.",
  privacidad: "Esto lo leo solo yo y lo uso únicamente para preparar la reunión de mañana: no lo comparto con nadie ni lo meto en ninguna lista. Esta página no manda nada a ningún sitio por su cuenta: se guarda en tu móvil mientras la rellenas, y sólo sale de ahí cuando tú le das al botón. Si quieres que lo borre después de vernos, me lo dices y lo borro.",
  pie: "Preparado para nuestra reunión",

  bloques: [
    {
      nombre: "Lo básico, para hacerme una idea",
      contexto: "Cuatro preguntas rápidas para saber de qué tamaño estamos hablando. A ojo, sin mirar nada.",
      preguntas: [
        { id:"cuentas_total", tipo:"opcion_unica", obligatoria:true,
          enunciado:"¿Cuántas cuentas llevas ahora mismo?",
          opciones:["1-3","4-6","7-10","11-15","Más de 15"] },
        { id:"cuentas_hosteleria", tipo:"opcion_unica", obligatoria:true,
          enunciado:"De esas, ¿cuántas son de hostelería?",
          ayuda:"Bares, restaurantes, cafeterías, obradores...",
          opciones:["Ninguna","1-2","3-5","6-10","Más de 10"] },
        { id:"sola_o_equipo", tipo:"opcion_unica", obligatoria:true,
          enunciado:"¿Trabajas sola o hay alguien más metido?",
          opciones:["Sola con todo","Sola, pero suelto algo puntual (vídeo, diseño...)","Tengo a alguien fijo ayudándome","Somos dos o más socias","Depende del mes"] },
        { id:"piezas_mes", tipo:"opcion_unica", obligatoria:true,
          enunciado:"En una cuenta normal, ¿cuántas piezas montas al mes?",
          ayuda:"Posts, portadas y stories que hay que diseñar. Las stories del día a día, esas no las cuentes.",
          opciones:["Menos de 8","8-12","13-20","21-30","Más de 30","Va por rachas, no hay dos meses iguales"] }
      ]
    },
    {
      nombre: "Dónde se te va la semana",
      contexto: "Aquí no busco horas exactas, busco saber qué te come de verdad.",
      preguntas: [
        { id:"top3_tiempo", tipo:"ranking", obligatoria:true, max_elegidas:3,
          enunciado:"Ordena las tres cosas que más tiempo te comen. Toca primero la que más.",
          ayuda:"Solo puedes marcar tres. Toca otra vez para quitarla.",
          opciones:["Diseñar en Canva desde cero","Sacar la misma pieza en varios formatos","Elegir, recortar y arreglar las fotos que me mandan","Escribir los textos","Montar y subtitular reels o vídeo","Perseguir al cliente para que mande material","Esperar a que el cliente apruebe y rehacer cambios","Programar y publicar","Contestar comentarios, mensajes y reseñas","Los informes de fin de mes","Reuniones, llamadas y correos","Mis facturas y mi papeleo"] },
        { id:"video_vs_imagen", tipo:"opcion_unica", obligatoria:true,
          enunciado:"De lo que entregas, ¿cuánto es vídeo o reels y cuánto imagen fija?",
          opciones:["Casi todo imagen fija","Más imagen que vídeo","Mitad y mitad","Más vídeo que imagen","Casi todo vídeo"] },
        { id:"resenas_google", tipo:"opcion_unica", obligatoria:true,
          enunciado:"¿Llevas también las reseñas de Google de alguno de tus clientes?",
          opciones:["Sí, las contesto yo","Las contesta el dueño, yo no me meto","Ni él ni yo, están sin contestar","No lo he mirado nunca","No sé si tengo acceso a eso"] }
      ]
    },
    {
      nombre: "Lo de Canva, en concreto",
      contexto: "Me dijiste que se te va la vida en Canva. Quiero saber en qué parte exactamente, porque cada una se arregla de una forma distinta.",
      preguntas: [
        { id:"canva_que_parte", tipo:"opcion_multiple", obligatoria:true,
          enunciado:"Cuando se te va el tiempo en Canva, ¿en qué se te va exactamente?",
          ayuda:"Marca todo lo que te pase, aunque sean seis.",
          opciones:["Buscar o adaptar la plantilla","Cambiar textos, precios y fechas uno a uno","Sacar la misma pieza en feed, story, portada, cartel...","Colocar y recortar las fotos dentro del diseño","Mantener los colores y la línea de cada marca","Hacer los cambios que me pide el cliente","Exportar, renombrar y ordenar los archivos","Encontrar un diseño antiguo entre todos los que tengo","Empezar casi de cero cada vez"] },
        { id:"formatos_por_pieza", tipo:"opcion_unica", obligatoria:true,
          enunciado:"Cuando haces una pieza, ¿en cuántos formatos o tamaños acaba?",
          opciones:["1","2","3","4 o más","Depende, pero casi siempre varios"],
          calculo_despues:"volumen" },
        { id:"porcentaje_repetitivo", tipo:"opcion_unica", obligatoria:true,
          enunciado:"De lo que haces, ¿cuánto es \"lo mismo de siempre cambiando los datos\"?",
          ayuda:"El menú del día, el plato de la semana, el horario de fiestas, la promo del finde...",
          opciones:["Casi nada, cada cosa es distinta","Como un cuarto","Como la mitad","La mayoría","Prácticamente todo"],
          calculo_despues:"repetitivo" },
        { id:"plan_canva", tipo:"opcion_unica", obligatoria:false,
          enunciado:"¿Qué plan de Canva tienes?",
          opciones:["El gratuito","Uno de pago (Pro)","Uno de equipo o empresa","Me han invitado al de un cliente","No estoy segura"] },
        { id:"diseno_que_se_fue", tipo:"texto_largo", obligatoria:false,
          enunciado:"Cuéntame el último diseño que se te fue de las manos: uno que te llevó mucho más tiempo del que debería.",
          ayuda:"Del tipo: \"la carta de Navidad del bar X. Me mandaron los platos en tres audios, dos precios estaban mal, y luego había que sacarlo en cuatro tamaños. Se me fue la tarde entera.\" Tres líneas me sobran.",
          placeholder:"Qué era y en qué se te fue el tiempo..." }
      ]
    },
    {
      nombre: "Las fotos y el material del cliente",
      contexto: "Me dijiste que \"auditas fotos\" y quiero entender bien qué significa eso en tu día a día.",
      preguntas: [
        { id:"como_llega_material", tipo:"opcion_multiple", obligatoria:true,
          enunciado:"¿Cómo te llega el material de un cliente de hostelería?",
          ayuda:"Marca todo lo que te pase.",
          opciones:["Fotos por WhatsApp, a montones","Audios de WhatsApp","Un PDF o una foto de la carta","Una carpeta compartida (Drive, Dropbox)","Por correo","Voy yo al local y lo hago","No me llega nada, tiro de fotos antiguas o de banco","Tengo que perseguirles cada vez"] },
        { id:"fotos_descarte", tipo:"opcion_multiple", obligatoria:false,
          enunciado:"¿Qué es lo que más te hace descartar una foto?",
          ayuda:"Marca todo lo que aplique.",
          opciones:["Está movida o desenfocada","Luz de bombilla, muy oscura o muy amarilla","La mesa está sin recoger o hay cosas por medio","Sale gente reconocible","Se ve algo que no toca (otra marca, un cable, el TPV)","Es horizontal y no me entra en vertical","Se ve pixelada o pesa poquísimo","Está repetida, casi igual que otra","No pega con el estilo de ese cliente"] }
      ]
    },
    {
      nombre: "Lo que no se ve en ningún sitio",
      contexto: "Tres preguntas algo más personales. Contesta lo que te salga.",
      preguntas: [
        { id:"que_has_probado", tipo:"texto_corto", obligatoria:false,
          enunciado:"¿Has intentado ya arreglar algo de esto con alguna herramienta o con IA?",
          ayuda:"Vale con \"probé ChatGPT para los textos y me salían todos iguales\" o \"monté un Notion y no lo abrí nunca más\".",
          placeholder:"Qué probaste y por qué lo dejaste" },
        { id:"como_cobras", tipo:"opcion_unica", obligatoria:true,
          enunciado:"Con tus clientes, ¿cómo cobras normalmente?",
          opciones:["Una cuota fija al mes por cuenta","Por horas o por bolsa de horas","Por proyecto o por campaña","Un poco de cada, según el cliente","Prefiero no decirlo"] },
        { id:"dos_horas", tipo:"opcion_unica", obligatoria:true,
          enunciado:"Imagínate que un martes cualquiera terminas dos horas antes de lo normal. ¿Qué pasa con esas dos horas?",
          opciones:["Meto otro cliente","Le doy más vueltas a lo que ya llevo","Me pongo con el vídeo, que lo tengo ahí pendiente","Suelto los clientes que no me compensan","Cierro el portátil y me voy","Se llenan solas de otra cosa, seguro"] }
      ]
    },
    {
      nombre: "Para mañana",
      contexto: "Tres cosas rápidas y ya está.",
      preguntas: [
        { id:"herramientas", tipo:"opcion_multiple", obligatoria:true,
          enunciado:"¿Con qué te apañas hoy? Marca lo que uses de verdad.",
          ayuda:"No te pido claves ni accesos a nada, ni ahora ni mañana. Es para no proponerte cosas que ya estás pagando.",
          opciones:["Canva","Metricool","El programador de Instagram y Facebook (Meta Business Suite)","Otro programador (Later, Buffer, Hootsuite, Planoly...)","CapCut o similar para vídeo","Lightroom o algo para retocar fotos","ChatGPT, Claude o Gemini","Hojas de cálculo","WhatsApp, que al final es mi gestor de proyectos"] },
        { id:"cuenta_ejemplo", tipo:"texto_corto", obligatoria:false,
          enunciado:"Si te parece bien, dime el @ de una de tus cuentas y preparo el ejemplo de mañana con esa.",
          ayuda:"Solo el @ de Instagram, lo que se ve en público. Nada de claves ni de darme acceso a nada. Si prefieres que no, déjalo en blanco.",
          placeholder:"@..." },
        { id:"grabar", tipo:"opcion_unica", obligatoria:true,
          enunciado:"¿Te importa que grabe la reunión de mañana?",
          ayuda:"Es solo para no estar tomando notas mientras me hablas. El resumen te lo paso a ti también.",
          opciones:["Sin problema","Prefiero que no"] }
      ]
    }
  ],

  calculos: [
    {
      id: "volumen",
      etiqueta: "Con lo que llevas puesto",
      calcular(r) {
        const c = V.cuentas[r.cuentas_total], p = V.piezas[r.piezas_mes], f = V.formatos[r.formatos_por_pieza];
        if (!c || !p || !f) return null;
        const t = Math.round(c * p * f / 5) * 5;
        return {
          cifra: "≈ " + t,
          unidad: "archivos al mes",
          glosa: "Cada uno lo abres, lo colocas y lo exportas a mano. No es que diseñes mucho: es que diseñas lo mismo muchas veces.",
          desglose: c + " cuentas × " + p + " piezas × " + f + " formatos — todo a ojo, con tus rangos"
        };
      }
    },
    {
      id: "repetitivo",
      etiqueta: "Y de esos",
      calcular(r) {
        const c = V.cuentas[r.cuentas_total], p = V.piezas[r.piezas_mes], f = V.formatos[r.formatos_por_pieza], k = V.repe[r.porcentaje_repetitivo];
        if (!c || !p || !f || !k) return null;
        const t = Math.round(c * p * f * k / 5) * 5;
        return {
          cifra: "≈ " + t,
          unidad: "son lo mismo cambiando los datos",
          glosa: "Esa parte se monta una vez y se rellena sola. La otra es la que tiene tu cabeza dentro, y ahí no me meto.",
          desglose: "es lo que vamos a mirar mañana"
        };
      }
    }
  ]
};

const V = {
  cuentas: {"1-3":2,"4-6":5,"7-10":8,"11-15":13,"Más de 15":18},
  piezas:  {"Menos de 8":6,"8-12":10,"13-20":16,"21-30":25,"Más de 30":38,"Va por rachas, no hay dos meses iguales":15},
  formatos:{"1":1,"2":2,"3":3,"4 o más":4.5,"Depende, pero casi siempre varios":2.5},
  repe:    {"Casi nada, cada cosa es distinta":0.1,"Como un cuarto":0.25,"Como la mitad":0.5,"La mayoría":0.7,"Prácticamente todo":0.9}
};
/* ============ FIN CONTENIDO ============ */

const $ = (s, r) => (r || document).querySelector(s);
const CLAVE = "form-cm-v1";

let respuestas = {};
try { respuestas = JSON.parse(localStorage.getItem(CLAVE) || "{}"); } catch (e) { respuestas = {}; }

function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify(respuestas)); } catch (e) {}
  pintarProgreso();
  pintarCalculos();
}

const todasLasPreguntas = () => FORM.bloques.flatMap(b => b.preguntas);

function contestada(p) {
  const v = respuestas[p.id];
  if (v === undefined || v === null) return false;
  if (Array.isArray(v)) return v.length > 0;
  return String(v).trim().length > 0;
}

/* ---------- render ---------- */
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function pintarCabecera() {
  document.title = FORM.titulo;
  $("#titulo").textContent = FORM.titulo;
  $("#subtitulo").textContent = FORM.subtitulo;
  $("#intro").innerHTML = FORM.intro.map(t => "<p>" + esc(t) + "</p>").join("");
  $("#meta").innerHTML = FORM.meta.map(t => "<span>" + esc(t) + "</span>").join("");
  $("#cierre").textContent = FORM.cierre;
  $("#privacidad").textContent = FORM.privacidad;
  $("#pie-izq").textContent = FORM.pie || "";
}

function pintarPregunta(p) {
  const el = document.createElement("div");
  el.className = "p";
  el.id = "p-" + p.id;

  const cab = document.createElement("div");
  cab.innerHTML =
    '<span class="p-enunciado">' + esc(p.enunciado) +
    (p.obligatoria ? "" : '<span class="p-opcional">opcional</span>') + "</span>" +
    (p.ayuda ? '<p class="p-ayuda">' + esc(p.ayuda) + "</p>" : "");
  el.appendChild(cab);

  const campos = document.createElement("div");
  campos.className = "p-campos";
  el.appendChild(campos);

  if (p.tipo === "opcion_unica") {
    campos.className += " unica";
    (p.opciones || []).forEach((o, i) => {
      const lab = document.createElement("label");
      lab.innerHTML =
        '<input type="radio" name="' + esc(p.id) + '" value="' + esc(o) + '"' +
        (respuestas[p.id] === o ? " checked" : "") + '>' +
        '<span class="marca"></span><span class="txt">' + esc(o) + "</span>";
      lab.querySelector("input").addEventListener("change", () => { respuestas[p.id] = o; guardar(); });
      campos.appendChild(lab);
    });

  } else if (p.tipo === "opcion_multiple") {
    campos.className += " multiple";
    const sel = () => (Array.isArray(respuestas[p.id]) ? respuestas[p.id] : []);
    (p.opciones || []).forEach(o => {
      const lab = document.createElement("label");
      lab.innerHTML =
        '<input type="checkbox" value="' + esc(o) + '"' + (sel().includes(o) ? " checked" : "") + '>' +
        '<span class="marca"></span><span class="txt">' + esc(o) + "</span>";
      lab.querySelector("input").addEventListener("change", e => {
        let s = sel().slice();
        if (e.target.checked) { if (!s.includes(o)) s.push(o); }
        else { s = s.filter(x => x !== o); }
        respuestas[p.id] = s;
        guardar();
      });
      campos.appendChild(lab);
    });

  } else if (p.tipo === "escala") {
    campos.className += " escala";
    const fila = document.createElement("div");
    fila.className = "escala-fila";
    const max = p.max || 5;
    for (let i = 1; i <= max; i++) {
      const lab = document.createElement("label");
      lab.innerHTML = '<input type="radio" name="' + esc(p.id) + '" value="' + i + '"' +
        (String(respuestas[p.id]) === String(i) ? " checked" : "") + "><span>" + i + "</span>";
      lab.querySelector("input").addEventListener("change", () => { respuestas[p.id] = i; guardar(); });
      fila.appendChild(lab);
    }
    campos.appendChild(fila);
    const topes = document.createElement("div");
    topes.className = "escala-topes";
    topes.innerHTML = "<span>" + esc(p.tope_min || "") + "</span><span>" + esc(p.tope_max || "") + "</span>";
    campos.appendChild(topes);

  } else if (p.tipo === "ranking") {
    campos.className += " ranking";
    const tope = p.max_elegidas || 3;
    (p.opciones || []).forEach(o => {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="orden"></span><span class="txt">' + esc(o) + "</span>";
      b.addEventListener("click", () => {
        let s = Array.isArray(respuestas[p.id]) ? respuestas[p.id].slice() : [];
        if (s.includes(o)) s = s.filter(x => x !== o);
        else if (s.length < tope) s.push(o);
        respuestas[p.id] = s;
        guardar();
        refrescarRanking(p);
      });
      campos.appendChild(b);
    });

  } else if (p.tipo === "texto_largo" || p.tipo === "texto_corto") {
    const largo = p.tipo === "texto_largo";
    const campo = document.createElement(largo ? "textarea" : "input");
    if (!largo) campo.type = "text";
    campo.placeholder = p.placeholder || "";
    campo.value = respuestas[p.id] || "";
    campo.addEventListener("input", () => { respuestas[p.id] = campo.value; guardar(); });
    campos.appendChild(campo);
  }

  return el;
}

function refrescarRanking(p) {
  const cont = $("#p-" + p.id + " .ranking");
  if (!cont) return;
  const s = Array.isArray(respuestas[p.id]) ? respuestas[p.id] : [];
  Array.from(cont.children).forEach(b => {
    const txt = b.querySelector(".txt").textContent;
    const i = s.indexOf(txt);
    const orden = b.querySelector(".orden");
    if (i >= 0) { b.dataset.orden = "1"; orden.dataset.n = String(i + 1); }
    else { delete b.dataset.orden; delete orden.dataset.n; }
  });
}

function pintarFormulario() {
  const cont = $("#formulario");
  cont.innerHTML = "";
  FORM.bloques.forEach((b, i) => {
    const sec = document.createElement("section");
    sec.className = "bloque";
    const cab = document.createElement("div");
    cab.className = "bloque-cab";
    cab.innerHTML =
      '<div class="bloque-num">' + String(i + 1).padStart(2, "0") + "</div>" +
      "<div><h2>" + esc(b.nombre) + "</h2>" +
      (b.contexto ? '<p class="ctx">' + esc(b.contexto) + "</p>" : "") + "</div>";
    sec.appendChild(cab);
    b.preguntas.forEach(p => {
      sec.appendChild(pintarPregunta(p));
      if (p.calculo_despues) {
        const c = document.createElement("div");
        c.className = "calculo";
        c.id = "calc-" + p.calculo_despues;
        c.hidden = true;
        sec.appendChild(c);
      }
    });
    cont.appendChild(sec);
  });
  FORM.bloques.flatMap(b => b.preguntas).filter(p => p.tipo === "ranking").forEach(refrescarRanking);
}

/* ---------- progreso ---------- */
function pintarProgreso() {
  const todas = todasLasPreguntas();
  const hechas = todas.filter(contestada).length;
  const pct = todas.length ? Math.round((hechas / todas.length) * 100) : 0;
  $("#barra").style.width = pct + "%";
  $("#pcontador").innerHTML = "<b>" + hechas + "</b> de " + todas.length;
  const quedan = todas.length - hechas;
  $("#ptiempo").textContent = quedan === 0 ? "listo ✓" : "~" + Math.max(1, Math.round(quedan * 0.4)) + " min";
}

/* ---------- cálculo en vivo ---------- */
function pintarCalculos() {
  (FORM.calculos || []).forEach(c => {
    const caja = document.getElementById("calc-" + c.id);
    if (!caja) return;
    const r = c.calcular(respuestas);
    if (!r) { caja.hidden = true; return; }
    caja.hidden = false;
    caja.innerHTML =
      '<div class="et">' + esc(c.etiqueta) + "</div>" +
      '<div class="cifra">' + esc(r.cifra) + (r.unidad ? "<small>" + esc(r.unidad) + "</small>" : "") + "</div>" +
      '<p class="glosa">' + esc(r.glosa) + "</p>" +
      (r.desglose ? '<div class="desglose">' + esc(r.desglose) + "</div>" : "");
  });
}

/* ---------- salida ---------- */
function comoTexto() {
  const L = [];
  L.push(FORM.titulo);
  L.push("");
  FORM.bloques.forEach(b => {
    const hay = b.preguntas.filter(contestada);
    if (!hay.length) return;
    L.push("— " + b.nombre.toUpperCase() + " —");
    hay.forEach(p => {
      let v = respuestas[p.id];
      if (Array.isArray(v)) v = p.tipo === "ranking" ? v.map((x, i) => (i + 1) + ") " + x).join("  ") : v.join(", ");
      if (p.tipo === "escala") v = v + "/" + (p.max || 5);
      L.push("• " + p.enunciado);
      L.push("  " + v);
    });
    L.push("");
  });
  const sin = todasLasPreguntas().filter(p => p.obligatoria && !contestada(p));
  if (sin.length) L.push("(sin contestar: " + sin.length + ")");
  return L.join("\n");
}

function obligatoriasPendientes() {
  return todasLasPreguntas().filter(p => p.obligatoria && !contestada(p));
}

function mostrarEstado(html, clase) {
  const e = $("#estado");
  e.hidden = false;
  e.className = "estado" + (clase ? " " + clase : "");
  e.innerHTML = html;
}

function rutaCopia(motivo) {
  const texto = comoTexto();
  $("#volcado").hidden = false;
  $("#volcado").textContent = texto;
  navigator.clipboard && navigator.clipboard.writeText(texto).then(
    () => mostrarEstado((motivo ? motivo + " " : "") + "<b>Respuestas copiadas.</b> Pégalas en el chat y me llegan igual — abajo las tienes por si acaso.", "aviso-fallo"),
    () => mostrarEstado((motivo ? motivo + " " : "") + "Copia el texto de abajo y pégamelo por WhatsApp.", "aviso-fallo")
  );
  if (!navigator.clipboard) mostrarEstado((motivo ? motivo + " " : "") + "Copia el texto de abajo y pégamelo por WhatsApp.", "aviso-fallo");
}

function enviar() {
  const pendientes = obligatoriasPendientes();
  if (pendientes.length) {
    const f = $("#faltan");
    f.hidden = false;
    f.textContent = "Te faltan " + pendientes.length + " respuesta" + (pendientes.length > 1 ? "s" : "") +
      ". Puedes mandarlo igual, pero cuantas más, mejor te ayudo.";
    document.getElementById("p-" + pendientes[0].id).scrollIntoView({ block: "center" });
    if (!enviar._insistido) { enviar._insistido = true; return; }
  }
  rutaCopia("");
}

function porWhatsapp() {
  const texto = comoTexto();
  window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(texto), "_blank");
  $("#volcado").hidden = false;
  $("#volcado").textContent = texto;
  mostrarEstado("Se te ha abierto WhatsApp con las respuestas escritas. Si no se ha abierto o " +
    "se ha cortado el texto, lo tienes entero aquí abajo para copiarlo a mano.", "aviso-fallo");
}

$("#enviar").addEventListener("click", porWhatsapp);
$("#copiar").addEventListener("click", () => rutaCopia(""));

pintarCabecera();
pintarFormulario();
pintarProgreso();
pintarCalculos();
</script>

</body>
</html>
